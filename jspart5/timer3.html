<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-hide alert banner</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #alertbox{
            background-color: #4caf50;
            color: white;
            padding: 12px 20px;
            width: fit-content;
            margin: 20px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="alertbox">i am here</div>
    <script>
        let div=document.querySelector("div");
        setTimeout(()=>{
            div.style.display="None"
        },3000)
    </script>
</body>
</html>
