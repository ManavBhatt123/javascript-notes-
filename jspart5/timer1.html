<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let sttime=setTimeout(() => {
        console.log("hello")
       }, 3000);//yeh code clear hogya . 

       setTimeout(() => {
        console.log("hello")
       }, 3000);

       let setinter=setInterval(()=>{
        console.log("hi i am manav")
       },4000)//yeh code bhi clear hogya 

       setInterval(()=>{
        console.log("hi i am manav")
       },4000)

       clearTimeout(sttime);
       clearInterval(setinter);


       let count = 10;
       let inter1=setInterval(function(){
        if(count>=1){
            count--;
            console.log(count);
        }
        else{
            clearInterval(inter1);
        }
       },1000)
    </script>
</body>
</html>
