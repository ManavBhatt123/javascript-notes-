        //observer pattern 
        class YoutubeChannel{
            constructor(){
                this.subscribers=[];
            }
            subscribe(user){
                this.subscribers.push(user);
                user.update(`you have subscribe the channel`);
            }
            unsubscribe(user){
                this.subscribers=this.subscribers.filter((sub)=>sub!==user);
                user.update(`you have unsubscribe the channel`)
            }
            notify(msg){
                this.subscribers.forEach((sub)=>sub.update(msg));
            }
        }
        class User{
            constructor(name){
                this.name=name;
            }
            update(data){
                console.log(`${this.name},${data}`);
            }
        }
        let newideas = new YoutubeChannel();
        let user1 = new User("Manav");
        let user2 = new User("ram");
        let user3 = new User("max");

        newideas.subscribe(user1);
        newideas.unsubscribe(user2);
