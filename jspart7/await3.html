<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let pr1 = new Promise(function(res,rej){
            setTimeout(() => {
                let rn = Math.floor(Math.random()*10);
                if(rn>5) res("resolve with " + rn)
                else rej("rejected with "+ rn)
            }, 1000);
        })

        async function abcd(){
            try{
                let val = await pr1;
                console.log(val)
            }
            catch(err){
                console.log(err);
            }
        }
        abcd()
    </script>
</body>
</html>
