<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //synchronous 
        console.log("hello1");
        console.log("hello2");
        console.log("hello3");

        //asynchronous 
        console.log("hey1");
        console.log("hey2");
        setTimeout(()=>{
            console.log("hey3")
        },3000)
        console.log("hey4")
    </script>
</body>
</html>
