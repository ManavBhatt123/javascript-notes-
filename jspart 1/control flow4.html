<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //early return pattern 
        function getval(val){
            if(val<25) return 'D';
            else if(val<50) return 'C';
            else if(val<75) return 'B';
            else return 'A';
        }
        console.log(getval(89));


        //question 
        function getGrade(score){
            if(score<=32 && score>=0) return 'Fail'
            else if(score<=59 && score>32) return 'D'
            else if(score<=69 && score>59) return 'C'
            else if(score<=79 && score>69) return 'B'
            else if(score<=89 && score>79) return 'A'
            else if(score<=100 && score>89) return 'A+';
            else return 'invlaid marks'
        }
        console.log(getGrade(12));


        //rock paper scissor 
        function rps(user,comp){
            if(user===comp) return "draw";

            if(user==="rock" && comp==="scissor")return "user wins";
            
            if(user==="paper" && comp==="rock")return "user wins";
            
            if(user==="scissor" && comp==="paper")return "user wins";
            
            if(user==="scissor" && comp==="rock")return "computer wins";
            
            if(user==="rock" && comp==="paper")return "computer wins";
            
            if(user==="paper" && comp==="scissor")return "computer wins";
        }
        console.log(rps("rock","rock"));

        
    </script>
</body>
</html>
