<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

       // example of primitive datatype 
       var a = 12;
       b = a ;
       a = a + 2;
       console.log(a)//14
       console.log(b)//12


       //example of refernce datatype 
       let c = [1,2,3]
       let d = c;
       c.pop();
       console.log(c)
       console.log(d)

       //dynamic typing 
       let x = 12;
       x = true ;

       //typeof quirks 
       console.log(typeof null);//objects 
       console.log(typeof NaN);//number

       //type coercion 
       console.log("4"+ 1);//41
       console.log("4"- 1);//3
       
       
    </script>
</body>
</html>
