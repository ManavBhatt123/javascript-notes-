<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //for
        for(let i = 1;i<10;i++){
            console.log(i);
        }



        //while
        let j = 1;
        while(j<20){
            console.log(j);
            j++;
        }


        //do-while
        let k = 23;
        do{
            console.log(k);
            k++;
        }
        while(k<2);



        //break
        for(let i = 1;i<201;i++){
            console.log(i);
            if(i===32){
                break;
            }
        }


        //continue
        for(let i = 1;i<30;i++){
            if(i===12){
                continue;
            }
            console.log(i);
        }

        
    </script>
</body>
</html>
