      //default paramter

      //rest parameter
      function num(...val){
        console.log(val);
      }
      num(1,2,4,5,6,6,7,8);


      //return value 
      function abcd(){
        return 12;
      }
      let val = abcd();
      console.log(val);

      //first class function 
      function ab(val){
        val();
      }
      ab(function(){
        console.log("hi")
      })

      //higher order function
       //1) function ko arguments ke roop mai leta ho 
      function ab(val){
        val();
      }
      ab(function(){
        console.log("hi")
      })
       //2) function ko return karta ho 
       function xy(){
        return function(){
          console.log("manav")
        }
       }
       xy()();

       //closures 
       function anc(){
        let a = 12;
        return function(){
          console.log(a);
        }
      }
      anc()();
      //lexical scoping
