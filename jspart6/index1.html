<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //functionsl scope
        function abcd(){
            let a = 2;
        }

        //block scope
        {
            let a = 2;
        }

        //if bhi block scope mai aata hai 
        if(true){
            let a = 2
        }

        //lexical scoping 
        function abcd(){
            let a = 10;
            function cdef(){
                console.log(a); 
            }
        }

        //closures 
        function abc(){
            let a = 13;
            return function(){
                console.log(a);
            }
        }
        let fnc=abc();
        fnc();

        //private counter 
        function countforme(){
            let c = 0;
            return function(){
                c++;
                console.log(c);
            }
        }
        let fnc1 = countforme();
        fnc1();
        fnc1();
        let fnc2 = countforme();
        fnc2();
        fnc2();
        fnc2();

        //clicklimiter 
        function clicklimiter(){
            let click = 0;
            return function(){
                if(click<5){
                    click++;
                    console.log(click);
                }
                else{
                    console.error("Limit exceed,you have reach the limit ");
                }
            }
        }
        let click=clicklimiter()
        click();
        click()
        click()
        click()
        click()
        click()


    </script>
</body>
</html>
