<head>
    <meta charset="UTF-8">

<body>
    <script>
        function Createbiscuit(name,price,qty,company,category){
            this.name = name;
            this.price = price;
            this.qty = qty;
            this.company = company;
            this.category = category;
        }

        let biscuit1=new Createbiscuit("Oreo",10,2,"Cadbury","Chocolate");

        function Createpencil(name,color,price,company){
            this.name=name;
            this.color=color;
            this.price=price;
            this.write = function(text){
                let h1=document.createElement("h1");
                h1.textContent=text;
                h1.style.color=color;
                document.body.append(h1);
            }
        }
        Createpencil.prototype.company="Doms"
        
        let pencil1= new Createpencil("natraj","red",15);
        let pencil2 = new Createpencil("doms","black",15);
    </script>
</body>
