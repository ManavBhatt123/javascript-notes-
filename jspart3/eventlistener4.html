<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family:sans-serif
        }
        body{
            height: 100%;
            width: 100%;
            background-color: rgba(11, 9, 9, 0.852);
        }
        input{
            display: block;
        }
        #main{
            
            width: 100%;
            height: 100%;
            padding: 50px;
            color: white;
        }
        .card{
            height: 250px;
            width: 350px;
            margin-top: 12px;
            border: 1px solid rgba(255, 255, 255, 0.512);
            border-radius: 10px;
            font-size: 15px;
            padding-left: 12px;
        } 
        .profile{
            height: 60px;
            width: 60px;
            background-color:rgba(42, 35, 35, 0.852);
            border-radius: 50%;
            border: 2px solid rgba(254, 254, 254, 0.43);
            margin-top: 20px;
            overflow: hidden;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        p{
            margin-top: 20px;
            font-size: 14px;
        }
        h5{
            margin-top: 5px;
        }
        h4{
            margin-top: 5px;
        }


    </style>
</head>
<body>
    <div id="main">
    <form action="">
        <input type="text" placeholder="profile pic"> 
        <input type="text" placeholder="name">
        <input type="text" placeholder="occupation">
        <input type="text" placeholder="info"> 
        <input type="submit">
    </form>
    </div>
    
    <script>
        let main=document.querySelector("#main");
        let inputs=document.querySelectorAll("input");
        let form=document.querySelector("form");
        form.addEventListener("submit",function(dets){
            dets.preventDefault();
            let card = document.createElement("div");
        card.classList.add("card");

        let profile=document.createElement("div");
        profile.classList.add("profile");

        card.appendChild(profile);

        let img=document.createElement("img");
        img.setAttribute("src",inputs[0].value)
        profile.appendChild(img);

        let h4=document.createElement("h4")
        h4.textContent=inputs[1].value;
        let h5=document.createElement("h5")
        h5.textContent=inputs[2].value;
        let p=document.createElement("p")
        p.textContent=inputs[3].value

        card.appendChild(h4);
        card.appendChild(h5);
        card.appendChild(p);
        main.appendChild(card);

        inputs.forEach(function(inp){
            if(inp.type!=="submit"){
                inp.value="";
            }
        })
        })
        
    </script>
</body>
</html>
