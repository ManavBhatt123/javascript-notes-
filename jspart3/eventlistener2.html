<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        }
        html,body{
            height: 100%;
            width: 100%;
        }
        #main{
            width: 100%;
            height: 100%;
            background-color: rgb(52, 101, 136);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h1{
            font-size: 300px;
            color: rgb(13, 1, 1);
            user-select: none;
            font-weight: 200;
        }
    </style>
</head>
<body>
    <div id="main">
        <h1>a</h1>
    </div>
    <script>
        let h1=document.querySelector("h1")
        window.addEventListener("keydown",function(dets){
            if(dets.key ===" "){
                h1.textContent = "SPC";
            }
            else{
                h1.textContent = dets.key;
            }
        })
    </script>
</body>
</html>
